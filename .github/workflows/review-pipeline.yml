name: Review Pipeline

# Risk-tiered independent AI review, shared from SkipPlatform (same pattern as
# Eugene). Low+Medium risk -> DeepSeek; High risk -> Codex via @codex review.
# See SkipLeague/SkipPlatform/docs/process/REVIEW_PIPELINE.md.
#
# Secrets (DEEPSEEK_API_KEY, CODEX_TRIGGER_TOKEN_SL, REVIEW_PIPELINE_LOG_TOKEN)
# and the SKIPPLATFORM_API_BASE_URL variable are SkipLeague org-level, so
# `secrets: inherit` covers them — no per-repo setup.
#
# Requires Codex auto-review OFF for this repo (else Codex double-reviews the
# Low/Medium tier that DeepSeek already handles, burning the metered bucket).

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: SkipLeague/SkipPlatform/.github/workflows/review-pipeline-reusable.yml@main
    secrets: inherit
