name: Release (create + push a version tag)

# The ONLY thing an agent session can do toward publishing a new version. It
# tags and pushes; it does NOT publish. Publishing stays in publish.yml, which
# is the one workflow npm's Trusted Publisher config trusts by filename — a
# second workflow calling `npm publish` would not be trusted even if it tried.
#
# The gate: this job runs under the `release` GitHub Environment, which the
# repo owner configures with a required reviewer (Settings → Environments →
# release → Required reviewers). A workflow_dispatch run against a
# reviewer-gated environment does not start until a required reviewer clicks
# Approve in the Actions UI — there is no path from "an agent asked for a
# release" to "npm has a new version" that skips a human clicking Approve.
#
# Why not just let an agent `git push` the tag directly? Because that push
# would carry the agent's own credentials with no gate at all — this workflow
# exists specifically so the actual ref write happens from a credential that
# only becomes usable after a human approves this specific run, rather than
# from a long-lived credential an agent holds. See docs/RELEASING.md.
#
# Why RELEASE_PAT and not the default GITHUB_TOKEN? GitHub does not fire
# other workflows' `push` triggers for pushes made with GITHUB_TOKEN — an
# anti-recursion protection. A GITHUB_TOKEN-pushed tag never reaches
# publish.yml's `on: push: tags:` trigger. RELEASE_PAT is a fine-grained PAT
# (Contents: Read and write, scoped to this repo only) stored as a secret on
# the `release` environment — same gate as the approval itself, since
# environment secrets are only readable inside a run of that environment.
#
# One-time setup (owner, in the GitHub UI — no tool can do this from outside):
#   1. Settings → Environments → New environment → name it "release" →
#      Required reviewers → add yourself.
#   2. Create a fine-grained PAT scoped to only this repo, Contents: Read and
#      write. Add it as an environment secret on `release` named RELEASE_PAT.
#   Full walkthrough in docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, e.g. "0.14.0" (no leading "v"). Must exactly
          match the version already committed in package.json on main — this
          workflow tags an existing commit, it does not bump the version.
        required: true

permissions:
  contents: read # the tag push itself uses RELEASE_PAT, not this token

jobs:
  tag:
    runs-on: ubuntu-latest
    environment: release # <-- the gate. No "release" environment == this job cannot start.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tagging needs full history, not the default shallow clone

      - name: Verify the version matches package.json on main
        # Refuses to tag a version nobody actually shipped in a commit. A
        # mismatch here means the wrong ref was released, or the input was a
        # typo — either way, fail loudly instead of tagging the wrong thing.
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::Input version '${{ inputs.version }}' does not match package.json version '$PKG_VERSION' on main." >&2
            echo "Merge the version bump to main first, then re-run this workflow." >&2
            exit 1
          fi

      - name: Refuse to re-tag an existing release
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists." >&2
            exit 1
          fi

      - name: Verify RELEASE_PAT is configured
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT is not set on the 'release' environment. See docs/RELEASING.md one-time setup." >&2
            exit 1
          fi

      - name: Create and push the tag
        # Pushed with RELEASE_PAT, not GITHUB_TOKEN — see the file header for
        # why. The write only happens because a required reviewer approved
        # this specific run; RELEASE_PAT is unreadable outside it.
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}

          Released via the gated release workflow, approved by a required
          reviewer on the 'release' environment. Triggered by run ${{ github.run_id }}."
          git remote set-url origin "https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git"
          git push origin "v${{ inputs.version }}"

      - name: Summary
        run: |
          echo "### Tagged v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushing this tag triggers **Publish to npm** (\`publish.yml\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "Watch the Actions tab for that run to confirm the publish succeeds." >> "$GITHUB_STEP_SUMMARY"
